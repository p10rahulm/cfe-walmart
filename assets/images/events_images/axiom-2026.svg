<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1A233A"/>
    </linearGradient>
    
    <!-- Primary Blue/Cyan Gradient for the 'A' -->
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    
    <!-- Accent Green/Teal Gradient for the Crossbar -->
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43E97B"/>
      <stop offset="100%" stop-color="#38F9D7"/>
    </linearGradient>
  </defs>
  
  <!-- Dark Modern Background (Can be removed if you want a transparent logo) -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Logo Graphic -->
  <g transform="translate(400, 240)">
    <!-- Main Abstract 'A' Shape -->
    <path d="M 0,-120 L -100,100 L -55,100 L 0,-20 L 55,100 L 100,100 Z" fill="url(#grad1)"/>
    
    <!-- Geometric Crossbar -->
    <path d="M -68,45 L 68,45 L 45,85 L -45,85 Z" fill="url(#grad2)"/>
    
    <!-- Data Nodes / Logical Points -->
    <circle cx="0" cy="-120" r="12" fill="#FFFFFF" />
    <circle cx="-100" cy="100" r="10" fill="#FFFFFF" />
    <circle cx="100" cy="100" r="10" fill="#FFFFFF" />
    <circle cx="0" cy="-20" r="14" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Connecting Pathways -->
    <line x1="0" y1="-20" x2="-68" y2="45" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
    <line x1="0" y1="-20" x2="68" y2="45" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  </g>
  
  <!-- Typography -->
  <text x="400" y="450" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="12">AXIOM</text>
  <text x="400" y="500" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#8FA0C3" text-anchor="middle" letter-spacing="6">IISC UNDERGRADUATE SYMPOSIUM</text>
</svg>
